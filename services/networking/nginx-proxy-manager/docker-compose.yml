services:
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      - "${NPM_HTTP_PORT:-80}:80"
      - "${NPM_ADMIN_PORT:-81}:81"
      - "${NPM_HTTPS_PORT:-443}:443"
    environment:
      TZ: ${TZ:-Asia/Dhaka}
      DISABLE_IPV6: "false"
    volumes:
      - ${NPM_DATA_DIR:-./data}:/data
      - ${NPM_LE_DIR:-./letsencrypt}:/etc/letsencrypt
    networks:
      - npm_network

networks:
  npm_network:
    name: ${NPM_NETWORK_NAME:-npm_network}
    driver: bridge
