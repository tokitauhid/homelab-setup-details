services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    restart: unless-stopped
    network_mode: host
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - TS_AUTHKEY=${TAILSCALE_AUTHKEY:-}
      - TS_EXTRA_ARGS=${TAILSCALE_EXTRA_ARGS:---advertise-exit-node --advertise-routes=192.168.0.0/24}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_ACCEPT_DNS=true
    volumes:
      - ${TAILSCALE_DATA_DIR:-./state}:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
