services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    ports:
      - "${QBIT_TORRENT_PORT:-6881}:6881/tcp"
      - "${QBIT_TORRENT_PORT:-6881}:6881/udp"
      - "${QBIT_WEBUI_PORT:-8082}:8080/tcp"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Asia/Dhaka}
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881
      - DOCKER_MODS=ghcr.io/themepark-dev/theme.park:qbittorrent
      - TP_THEME=${TP_THEME:-catppuccin-mocha}
      - TP_COMMUNITY_THEME=true
    volumes:
      - ${QBIT_CONFIG_DIR:-./config}:/config
      - ${DOWNLOADS_DIR:-/data/downloads}:/downloads
    networks:
      - qbittorrent_network

networks:
  qbittorrent_network:
    name: ${QBIT_NETWORK_NAME:-qbittorrent_network}
    driver: bridge
