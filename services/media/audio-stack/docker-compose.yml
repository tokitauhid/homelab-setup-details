services:
  # PipeWire Network Audio Receiver (RTP + PulseAudio TCP for Linux PC & Laptop)
  truenas-pulse:
    image: alpine:latest
    container_name: truenas-pulse
    restart: unless-stopped
    network_mode: host
    ipc: host
    cap_add:
      - SYS_NICE
    devices:
      - /dev/snd:/dev/snd
    environment:
      - TZ=${TZ:-Asia/Dhaka}
      - HOME=/tmp
      - XDG_RUNTIME_DIR=/tmp/pw
      - PIPEWIRE_RUNTIME_DIR=/tmp/pw
      - XDG_STATE_HOME=/tmp/pw
    volumes:
      - ${AUDIO_CONFIG_DIR:-.}/asound.conf:/etc/asound.conf:ro
      - ${AUDIO_CONFIG_DIR:-.}/pipewire/10-truenas-audio.conf:/etc/pipewire/pipewire.conf.d/10-truenas-audio.conf:ro
      - ${AUDIO_CONFIG_DIR:-.}/pipewire/10-tcp.conf:/etc/pipewire/pipewire-pulse.conf.d/10-tcp.conf:ro
    command:
      - sh
      - -c
      - |
        if ! command -v pipewire >/dev/null 2>&1; then
          apk add --no-cache pipewire pipewire-alsa pipewire-pulse pipewire-tools wireplumber su-exec
        fi
        mkdir -p /tmp/pw && chown -R ${PUID:-568}:${AUDIO_GID:-29} /tmp/pw && chmod 700 /tmp/pw
        su-exec ${PUID:-568}:${AUDIO_GID:-29} pipewire &
        PW_PID=$$!
        sleep 1
        su-exec ${PUID:-568}:${AUDIO_GID:-29} wireplumber -p policy &
        su-exec ${PUID:-568}:${AUDIO_GID:-29} pipewire-pulse &
        wait "$$PW_PID"

  # DLNA / UPnP Renderer (for Android: Symfonium, BubbleUPnP, Jellyfin)
  truenas-dlna:
    image: giof71/gmrender-resurrect:latest
    container_name: truenas-dlna
    restart: unless-stopped
    network_mode: host
    ipc: host
    devices:
      - /dev/snd:/dev/snd
    environment:
      - USER_MODE=yes
      - PUID=${PUID:-568}
      - PGID=${PGID:-568}
      - AUDIO_GID=${AUDIO_GID:-29}
      - TZ=${TZ:-Asia/Dhaka}
      - FRIENDLY_NAME=${SPEAKER_NAME:-TrueNAS-Speakers}
      - CARD_NAME=${ALSA_CARD_NAME:-Generic}
      - GSTOUT_AUDIOSINK=alsasink
      - NETWORK_INTERFACE=${NETWORK_INTERFACE:-enp34s0}
    volumes:
      - ${DOCKER_ROOT:-~/docker}/gmrender:/config
      - ${AUDIO_CONFIG_DIR:-.}/asound.conf:/etc/asound.conf:ro

  # Spotify Connect Receiver
  truenas-spotify:
    image: ghcr.io/devgianlu/go-librespot:latest
    container_name: truenas-spotify
    restart: unless-stopped
    network_mode: host
    ipc: host
    user: ${PUID:-568}:${PGID:-568}
    group_add:
      - ${AUDIO_GID:-29}
    devices:
      - /dev/snd:/dev/snd
    environment:
      - TZ=${TZ:-Asia/Dhaka}
    volumes:
      - ${DOCKER_ROOT:-~/docker}/go-librespot:/config
      - /var/run/dbus:/var/run/dbus
      - /var/run/avahi-daemon:/var/run/avahi-daemon
      - ${AUDIO_CONFIG_DIR:-.}/asound.conf:/etc/asound.conf:ro
