services:
  # PulseAudio TCP Receiver (low-latency audio sink for Linux PC & Laptop)
  truenas-pulse:
    image: alpine:latest
    container_name: truenas-pulse
    restart: unless-stopped
    network_mode: host
    ipc: host
    cap_add:
      - SYS_NICE
    devices:
      - /dev/snd:/dev/snd
    environment:
      - TZ=${TZ:-Asia/Dhaka}
      - HOME=/tmp
      - PULSE_RUNTIME_PATH=/tmp/pulse
      - PULSE_STATE_PATH=/tmp/pulse
    volumes:
      - ${AUDIO_CONFIG_DIR:-.}/asound.conf:/etc/asound.conf:ro
      - ${AUDIO_CONFIG_DIR:-.}/pulseaudio/default.pa:/etc/pulse/default.pa:ro
    command:
      - sh
      - -c
      - |
        if ! command -v pulseaudio >/dev/null 2>&1; then
          apk add --no-cache pulseaudio pulseaudio-alsa su-exec
        fi
        mkdir -p /tmp/pulse && chown -R ${PUID:-568}:${AUDIO_GID:-29} /tmp/pulse
        exec nice -n -10 su-exec ${PUID:-568}:${AUDIO_GID:-29} pulseaudio -n -F /etc/pulse/default.pa --exit-idle-time=-1 --disallow-exit --disable-shm=yes --resample-method=speex-float-5 --daemonize=no --log-target=stderr

  # DLNA / UPnP Renderer (for Android: Symfonium, BubbleUPnP, Jellyfin)
  truenas-dlna:
    image: giof71/gmrender-resurrect:latest
    container_name: truenas-dlna
    restart: unless-stopped
    network_mode: host
    ipc: host
    devices:
      - /dev/snd:/dev/snd
    environment:
      - USER_MODE=yes
      - PUID=${PUID:-568}
      - PGID=${PGID:-568}
      - AUDIO_GID=${AUDIO_GID:-29}
      - TZ=${TZ:-Asia/Dhaka}
      - FRIENDLY_NAME=${SPEAKER_NAME:-TrueNAS-Speakers}
      - CARD_NAME=${ALSA_CARD_NAME:-Generic}
      - GSTOUT_AUDIOSINK=alsasink
      - NETWORK_INTERFACE=${NETWORK_INTERFACE:-enp34s0}
    volumes:
      - ${DOCKER_ROOT:-~/docker}/gmrender:/config
      - ${AUDIO_CONFIG_DIR:-.}/asound.conf:/etc/asound.conf:ro

  # Spotify Connect Receiver
  truenas-spotify:
    image: ghcr.io/devgianlu/go-librespot:latest
    container_name: truenas-spotify
    restart: unless-stopped
    network_mode: host
    ipc: host
    user: ${PUID:-568}:${PGID:-568}
    group_add:
      - ${AUDIO_GID:-29}
    devices:
      - /dev/snd:/dev/snd
    environment:
      - TZ=${TZ:-Asia/Dhaka}
    volumes:
      - ${DOCKER_ROOT:-~/docker}/go-librespot:/config
      - /var/run/dbus:/var/run/dbus
      - /var/run/avahi-daemon:/var/run/avahi-daemon
      - ${AUDIO_CONFIG_DIR:-.}/asound.conf:/etc/asound.conf:ro
