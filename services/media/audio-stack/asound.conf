pcm.dmix_generic {
    type dmix
    ipc_key 1024
    ipc_perm 0666
    ipc_gid 29
    slave {
        pcm "hw:Generic,0"
        period_time 0
        period_size 1024
        buffer_size 8192
        rate 48000
    }
}

pcm.shared_speakers {
    type plug
    slave.pcm "dmix_generic"
}

pcm.!default {
    type plug
    slave.pcm "dmix_generic"
}
