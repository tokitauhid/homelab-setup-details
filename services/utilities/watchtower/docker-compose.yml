services:
  watchtower:
    image: nickfedor/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Asia/Dhaka}
      - WATCHTOWER_NOTIFICATIONS_HOSTNAME=${WATCHTOWER_HOSTNAME:-truenas}
      - WATCHTOWER_CLEANUP=${WATCHTOWER_CLEANUP:-true}
      - WATCHTOWER_INCLUDE_STOPPED=${WATCHTOWER_INCLUDE_STOPPED:-true}
      - WATCHTOWER_SCHEDULE=${WATCHTOWER_SCHEDULE:-0 0 3 * * *}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - watchtower_network

networks:
  watchtower_network:
    name: ${WATCHTOWER_NETWORK_NAME:-watchtower_network}
    driver: bridge
