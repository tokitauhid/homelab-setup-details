services:
  qdirstat:
    image: lscr.io/linuxserver/qdirstat:latest
    container_name: qdirstat
    restart: unless-stopped
    ports:
      - "${QDIRSTAT_HTTP_PORT:-3010}:3000/tcp"
      - "${QDIRSTAT_HTTPS_PORT:-3011}:3001/tcp"
    environment:
      - PUID=${PUID:-568}
      - PGID=${PGID:-568}
      - TZ=${TZ:-Asia/Dhaka}
    volumes:
      - ${QDIRSTAT_CONFIG_DIR:-./config}:/config
      - ${QDIRSTAT_SCAN_DIR:-/mnt/Jellyfin}:/Jellyfin_Pool
    networks:
      - qdirstat_network

networks:
  qdirstat_network:
    name: ${QDIRSTAT_NETWORK_NAME:-qdirstat_network}
    driver: bridge
