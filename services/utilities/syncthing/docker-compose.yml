services:
  syncthing:
    image: lscr.io/linuxserver/syncthing:latest
    container_name: syncthing
    restart: unless-stopped
    ports:
      - "${SYNCTHING_WEB_PORT:-8384}:8384/tcp"
      - "${SYNCTHING_LISTEN_PORT:-22000}:22000/tcp"
      - "${SYNCTHING_LISTEN_PORT:-22000}:22000/udp"
      - "${SYNCTHING_DISCOVERY_PORT:-21027}:21027/udp"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Asia/Dhaka}
    volumes:
      - ${SYNCTHING_CONFIG_DIR:-./config}:/config
      - ${SYNCTHING_DATA_DIR:-./data}:/data/sync
    networks:
      - syncthing_network

networks:
  syncthing_network:
    name: ${SYNCTHING_NETWORK_NAME:-syncthing_network}
    driver: bridge
